# PostgreSQL cho môi trường phát triển: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chunhiem
      POSTGRES_PASSWORD: chunhiem
      POSTGRES_DB: chunhiem
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
