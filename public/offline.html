<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b38">
<title>Mất kết nối — Sổ Chủ Nhiệm</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f3f5f9; color: #121826; padding: 24px; box-sizing: border-box; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #0d111a; color: #edf0f6; } p { color: #8d97ab !important; } }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 1.3rem; margin: 18px 0 6px; }
  p { color: #6b7489; margin: 0 0 22px; max-width: 320px; }
  button { font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 10px; border: 0; background: #2457d6; color: #fff; }
</style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" alt="">
    <h1>Không có kết nối mạng</h1>
    <p>Kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại. Dữ liệu chưa gửi trên biểu mẫu vẫn được giữ khi bạn quay lại trang trước.</p>
    <button onclick="location.reload()">Thử lại</button>
  </div>
</body>
</html>
